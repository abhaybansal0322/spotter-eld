# Render Blueprint for the Django API and its Postgres database (spec §5, §16, §28).
# Free web services cannot run a pre-deploy command, so migrations and the throttle cache table are made at build time,
# which is what Render's own Django guide does. Every step is idempotent.
databases:
  - name: spotter-eld-db
    plan: free
    region: frankfurt  # beside OpenRouteService in Heidelberg: a plan makes up to 15 sequential ORS calls
    databaseName: spotter_eld
    user: spotter_eld

services:
  - type: web
    name: spotter-eld-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py createcachetable
    # Two workers share throttle counts through the database cache. --timeout 60 covers a plan's 4 to 15 ORS calls.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DJANGO_ENV
        value: prod
      - key: NUM_PROXIES  # X-Forwarded-For hops Render adds in front of Django; verified against the throttle's keys
        value: "2"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spotter-eld-db
          property: connectionString
      - key: ORS_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false  # optional extra hosts; the onrender.com host comes from RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # the Vercel production URL, e.g. https://spotter-eld.vercel.app
